site_name: Enclave Messenger Docs
site_url: https://messenger.docs.projectenclave.dev
site_description: Documentation for Enclave Messenger, a peer-to-peer encrypted messenger.
repo_url: https://github.com/Project-Enclave/Docs
repo_name: Project-Enclave/Docs
edit_uri: edit/main/docs/

use_directory_urls: true
strict: false

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/theme-font.js

extra:
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

plugins:
  - search
  - privacy:
      assets: false

theme:
  name: material
  custom_dir: overrides
  font: false

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Use dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Use light mode

    - scheme: default
      toggle:
        icon: material/format-float-left
        name: Use system preference

  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Overview: 01-overview.md
  - Architecture: 02-architecture.md
  - Security Model: 03-security-model.md
  - Installation: 04-installation.md
  - Configuration: 05-configuration.md
  - Usage: 06-usage.md
  - Plugins: 07-plugins.md
  - Development: 08-development.md
  - Testing: 09-testing.md
  - Deployment: 10-deployment.md
  - Troubleshooting: 11-troubleshooting.md
